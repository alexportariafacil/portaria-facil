
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portaria Fácil</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #123b63;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }
    main {
      max-width: 600px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px #0000000d;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }
    button {
      border: 0;
      background: #1769aa;
      color: white;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
    }
    .aviso {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>📦 Portaria Fácil</h1>
    <p>Controle de encomendas do condomínio</p>
  </header>

  <main>
    <section class="card">
      <h2>Nova encomenda</h2>
      <form id="formulario">
        <label for="unidade">Unidade / Apartamento</label>
        <input id="unidade" required placeholder="Ex.: 101">

        <label for="morador">Nome do morador</label>
        <input id="morador" required placeholder="Nome do destinatário">

        <label for="descricao">Descrição da encomenda</label>
        <input id="descricao" required placeholder="Ex.: Caixa ou envelope">

        <button type="submit">Registrar encomenda</button>
      </form>
      <p class="aviso" id="mensagem"></p>
    </section>

    <section class="card">
      <h2>Encomendas desta sessão</h2>
      <div id="lista">Nenhuma encomenda registrada.</div>
      <p class="aviso">
        Protótipo inicial: os registros não ficam salvos
        permanentemente e ainda não são compartilhados.
      </p>
    </section>
  </main>

  <footer>
    Portaria Fácil, desenvolvido por Alex Projeto
  </footer>

  <script>
    const formulario = document.getElementById("formulario");
    const lista = document.getElementById("lista");
    const mensagem = document.getElementById("mensagem");
    const encomendas = [];

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      const unidade = document.getElementById("unidade").value.trim();
      const morador = document.getElementById("morador").value.trim();
      const descricao = document.getElementById("descricao").value.trim();

      if (!unidade || !morador || !descricao) return;

      encomendas.push({ unidade, morador, descricao });

      lista.replaceChildren();

      encomendas.forEach(function(item, indice) {
        const bloco = document.createElement("div");
        bloco.style.padding = "12px 0";
        bloco.style.borderBottom = "1px solid #e2e8f0";

        const titulo = document.createElement("strong");
        titulo.textContent = "Encomenda " + (indice + 1);

        const detalhes = document.createElement("p");
        detalhes.textContent =
          "Unidade " + item.unidade + " — " +
          item.morador + " — " + item.descricao;

        bloco.append(titulo, detalhes);
        lista.appendChild(bloco);
      });

      mensagem.textContent = "Encomenda registrada nesta sessão.";
      formulario.reset();
    });
  </script>
</body>
</html>
